name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: app
    attributes:
      label: Apps involved
      description: Apps whose windows you tried to group (e.g. Safari, Finder)
  - type: input
    id: version
    attributes:
      label: ShelfTabs version
      description: Shown in Settings > General > Updates
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
